#cloud-config
package_update: true
package_upgrade: true

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    permissions: "0644"
    owner: root:root
    content: |
      <html>
        <head>
          <title>Azure Load Balanced Web Platform</title>
        </head>
        <body>
          <h1>Hello from web-vm-01</h1>
          <p>This page is served by backend node 1.</p>
        </body>
      </html>

runcmd:
  - systemctl enable nginx
  - systemctl restart nginx